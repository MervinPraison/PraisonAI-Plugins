name: Claude Assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [assigned, labeled, opened]
  pull_request_review:
    types: [submitted]

jobs:
  # ================================================================
  # Job 1: Lightweight triage for ALL new issues (including external users)
  # Posts welcome comment + adds triage labels. No Claude code execution.
  # ================================================================
  issue-triage:
    if: |
      github.event_name == 'issues' &&
      github.event.action == 'opened' &&
      !contains(toJSON(github.event.issue.labels), 'claude')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CLAUDE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Triage and acknowledge issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const issue = context.payload.issue;
            const title = (issue.title || '').toLowerCase();
            const body = (issue.body || '').toLowerCase();
            const content = title + ' ' + body;
            const isOwner = ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(
              issue.author_association
            );

            // --- Label triage ---
            const labels = [];

            // Kind labels
            if (content.includes('feature request') || content.includes('[feature')) {
              labels.push('enhancement');
            } else if (content.includes('bug') || content.includes('error') || content.includes('crash') || content.includes('traceback')) {
              labels.push('bug');
            } else if (content.includes('question') || content.includes('how do i') || content.includes('how to')) {
              labels.push('question');
            }

            // Area labels
            if (content.includes('security') || content.includes('cve') || content.includes('vulnerability')) {
              labels.push('security');
            }
            if (content.includes('performance') || content.includes('slow') || content.includes('memory leak')) {
              labels.push('performance');
            }
            if (content.includes('documentation') || content.includes('docs')) {
              labels.push('documentation');
            }
            if (content.includes('typescript') || content.includes('javascript') || content.includes('npm')) {
              labels.push('javascript');
            }

            // Apply labels
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                issue_number: issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels
              });
            }

            // --- Acknowledgment comment (external users only) ---
            if (!isOwner) {
              await github.rest.issues.createComment({
                issue_number: issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: [
                  `👋 Thanks for opening this issue, @${issue.user.login}!`,
                  '',
                  'A maintainer will review this shortly. In the meantime:',
                  '- Make sure you\'ve included steps to reproduce (for bugs)',
                  '- Check [existing issues](https://github.com/MervinPraison/PraisonAI/issues) for duplicates',
                  '- Review the [documentation](https://docs.praison.ai) for related guides',
                  '',
                  '_A maintainer can trigger deeper analysis by commenting `@claude` on this issue._'
                ].join('\n')
              });
            }

            // --- For owner: add 'claude' label to trigger the code-fix job ---
            if (isOwner) {
              await github.rest.issues.addLabels({
                issue_number: issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['claude']
              });
            }

  # ================================================================
  # Job 2: Full Claude code-fix (owner/collaborator only)
  # Triggers on: labeled 'claude', @claude comments, assignments
  # ================================================================
  claude-response:
    # Allow: human users, github-actions[bot] (auto-comments/labels)
    # Block: dependabot, cursor, renovate, other bots
    # Skip 'opened' events — triage job handles those above
    if: |
      github.event.action != 'opened' &&
      (github.event.action != 'labeled' || github.event.label.name == 'claude') &&
      (github.event_name != 'issue_comment' || contains(github.event.comment.body, '@claude')) &&
      (
        !contains(github.actor, '[bot]') ||
        github.actor == 'github-actions[bot]' ||
        github.actor == 'praisonai-triage-agent[bot]'
      ) &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'cursor[bot]' &&
      github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CLAUDE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: anthropics/claude-code-action@beta
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          allowed_bots: 'praisonai-triage-agent[bot]'
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          trigger_phrase: "@claude"
          label_trigger: "claude"

          direct_prompt: |
            You are implementing changes in MervinPraison/PraisonAI-Plugins (lifecycle plugins for PraisonAI). Follow README.md and patterns under `src/praisonai_plugins/`.

            Primary scope: `src/praisonai_plugins/`, `tests/`. Depends on `praisonaiagents` only — do not vendor core SDK here.

            STEP 0 — SETUP GIT IDENTITY & AUTH:
            git config --global user.name "MervinPraison"
            git config --global user.email "454862+MervinPraison@users.noreply.github.com"
            gh auth setup-git

            STEP 1 — READ GUIDELINES:
            Read README.md. Register plugins via `[project.entry-points."praisonai.plugins"]` in `pyproject.toml`.

            STEP 2 — LAYER VALIDATION (mandatory before coding):
            This repo IS the **Plugins** layer (`praisonai-plugins`). Lifecycle extensions belong here.
            - **Implement here:** hooks, guardrails, policies, skills, tracing/logging providers, `praisonai.plugins` entry points
            - **Route to PraisonAI (core):** new PluginManager APIs, hook events, protocols → MervinPraison/PraisonAI
            - **Route to PraisonAI (wrapper):** CLI plugin commands → MervinPraison/PraisonAI
            - **Route to PraisonAI-Tools:** agent-callable API tools (Slack post, GitHub PR, etc.) → MervinPraison/PraisonAI-Tools
            - **Reject:** agent-callable tools implemented as plugins; heavy third-party SDKs without lazy imports
            If the issue belongs in another layer, explain why and do not implement here.

            STEP 3 — IMPLEMENT (in this repo):
            BRANCH="claude/issue-${{ github.event.issue.number }}-$(date +%Y%m%d-%H%M%S)"
            git checkout -b "$BRANCH"
            Implement minimal, focused changes. Lazy-import optional deps inside hook methods.

            STEP 4 — TEST:
            Run targeted pytest (e.g. pytest tests/ -q) or plugin discovery smoke test.

            STEP 5 — COMMIT, PUSH, OPEN PR (mandatory if you produced commits):
            git add -A
            git commit -m "feat: <short summary> (fixes #${{ github.event.issue.number }})"
            git push -u origin "$BRANCH"
            gh pr create --repo "${{ github.repository }}" --base main --head "$BRANCH" --title "feat: <short title>" --body "Fixes #${{ github.event.issue.number }}"
            CRITICAL: Do not stop after `git push`. You MUST complete `gh pr create` and post the PR URL on the issue.
          allowed_tools: |
            Bash(git:*)
            Bash(python:*)
            Bash(pip:*)
            Bash(conda:*)
            Bash(pytest:*)
            Bash(gh:*)
            Bash(python -m pytest:*)
            Bash(python -m pip:*)
            Bash(poetry:*)
            View
            GlobTool
            GrepTool
            BatchTool
            Edit
            Replace
            mcp__github__get_issue
            mcp__github__get_issue_comments
            mcp__github__update_issue
          timeout_minutes: 30
